name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2

      - name: make lint
        run: make lint

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./cmd/workbox

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.2"

      - name: bash syntax (cloud-init template)
        run: make sh-check

      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform -chdir=infra init -backend=false

      - name: terraform validate
        run: terraform -chdir=infra validate
